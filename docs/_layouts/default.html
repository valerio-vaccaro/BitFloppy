<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11152b">
    {% assign page_description = page.description | default: site.description %}
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <meta name="description" content="{{ page_description | escape }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page_description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/lolin_s2_mini.jpg' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="BitFloppy home">
        <span class="brand-disk" aria-hidden="true">▣</span>
        <span>BITFLOPPY</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/user-guide.html' | relative_url }}">Guide</a>
        <a href="{{ '/flashing.html' | relative_url }}">Flash</a>
        <a href="{{ '/sparrow.html' | relative_url }}">Sparrow</a>
        <a href="{{ '/binaries/' | relative_url }}">Firmware</a>
      </nav>
    </header>

    <main class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>BITFLOPPY // TESTNET ONLY</span>
      <span>▲ KEEP YOUR SEED OFFLINE ▲</span>
    </footer>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"BitFloppy","applicationCategory":"SecurityApplication","operatingSystem":"ESP32-S2","description":{{ site.description | jsonify }},"url":{{ site.url | append: site.baseurl | jsonify }}}
    </script>
  </body>
</html>
